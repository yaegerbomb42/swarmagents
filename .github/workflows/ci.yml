name: CI

# SwarmAgents is the only app in this repo (apps/swarmagents). CI runs the
# repo-level checks plus the SwarmAgents gates from its own directory.
on: [push, pull_request]

permissions:
  contents: read

jobs:
  repo-checks:
    name: Repo consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Shell syntax (deploy scripts)
        run: |
          bash -n deploy.sh
          for f in apps/swarmagents/deploy/*.sh apps/swarmagents/scripts/*.sh apps/swarmagents/tools/swarm-board/board.sh; do bash -n "$f"; done
          node --check apps/swarmagents/scripts/playtest.mjs

      - name: No generated trees tracked
        run: |
          if git ls-files | grep -qE '(^|/)(\.venv|venv|__pycache__|\.history|_dist_old_bak|\.npm-cache[^/]*)/|\.pyc$'; then
            echo "Generated files are tracked — see .gitignore:"
            git ls-files | grep -E '(^|/)(\.venv|venv|__pycache__|\.history|_dist_old_bak|\.npm-cache[^/]*)/|\.pyc$'
            exit 1
          fi

  swarmagents:
    name: SwarmAgents gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/swarmagents/package-lock.json

      - name: Install dependencies
        working-directory: apps/swarmagents
        run: npm ci

      # Typecheck, unit tests, lint, build. The boot + e2e half of
      # scripts/test-all.sh runs in the e2e job below (fake VM driver,
      # no Docker needed) so a flaky unit failure cannot hide e2e signal.
      - name: Typecheck
        working-directory: apps/swarmagents
        run: npm run typecheck

      - name: Unit tests (JUnit artifact)
        working-directory: apps/swarmagents
        run: |
          npm run test:ci
          echo "junit written: $(wc -c < junit.xml) bytes"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: apps/swarmagents/junit.xml
          if-no-files-found: warn

      - name: Lint
        working-directory: apps/swarmagents
        run: npm run lint

      - name: E2E typecheck
        working-directory: apps/swarmagents
        run: npm run typecheck:e2e

      - name: Build
        working-directory: apps/swarmagents
        run: npm run build

  e2e:
    name: E2E (boot + specs, fake VM)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/swarmagents/package-lock.json

      # --ignore-scripts: no dependency lifecycle scripts run at install
      # time. The one install script the e2e run needs (esbuild's platform
      # binary download, required by tsx) is run explicitly below; fsevents
      # is darwin-only and a no-op on Linux.
      - name: Install dependencies
        working-directory: apps/swarmagents
        run: npm ci --ignore-scripts && node node_modules/esbuild/install.js

      # The specs drive a real Chromium via playwright-core; the runner
      # image ships no browser. --with-deps installs the system
      # libraries headless Chromium needs (passwordless sudo on hosted
      # runners).
      # Use the locally installed playwright-core binary (version pinned by
      # the lockfile) instead of npx, which would fetch and run packages
      # on demand.
      - name: Install Chromium for e2e
        working-directory: apps/swarmagents
        run: ./node_modules/.bin/playwright-core install --with-deps chromium

      # The byoc spec starts a real swarm-node in --host-mode, whose desktop
      # needs Xvfb + x11vnc + websockify; without them the node reports no
      # desktop and the spec fails at the desktop step.
      - name: Install host-desktop packages for BYOC e2e
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb x11vnc websockify

      - name: Build
        working-directory: apps/swarmagents
        run: npm run build

      # Boots the built app on a free port (fake VM driver, temp
      # SWARM_HOME) and runs the specs against it. Typecheck/unit
      # already ran in the gates job, so this job does not repeat them.
      - name: Boot + E2E
        working-directory: apps/swarmagents
        env:
          SCREENSHOT_DIR: ${{ github.workspace }}/e2e-screenshots
        run: scripts/boot-and-e2e.sh

      - name: Upload e2e screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: e2e-screenshots
          if-no-files-found: ignore
