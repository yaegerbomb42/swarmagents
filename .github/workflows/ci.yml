name: CI

# SwarmAgents is the only app in this repo (apps/swarmagents). CI runs the
# repo-level checks plus the SwarmAgents gates from its own directory.
on: [push, pull_request]

permissions:
  contents: read

jobs:
  repo-checks:
    name: Repo consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Shell syntax (deploy scripts)
        run: |
          bash -n deploy.sh
          for f in apps/swarmagents/deploy/*.sh apps/swarmagents/scripts/*.sh apps/swarmagents/tools/swarm-board/board.sh; do bash -n "$f"; done
          node --check apps/swarmagents/scripts/playtest.mjs

      - name: No generated trees tracked
        run: |
          if git ls-files | grep -qE '(^|/)(\.venv|venv|__pycache__|\.history|_dist_old_bak|\.npm-cache[^/]*)/|\.pyc$'; then
            echo "Generated files are tracked — see .gitignore:"
            git ls-files | grep -E '(^|/)(\.venv|venv|__pycache__|\.history|_dist_old_bak|\.npm-cache[^/]*)/|\.pyc$'
            exit 1
          fi

  swarmagents:
    name: SwarmAgents gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/swarmagents/package-lock.json

      - name: Install dependencies
        working-directory: apps/swarmagents
        run: npm ci

      # Typecheck, unit tests, lint — the same gates as scripts/test-all.sh
      # minus the Docker-dependent build/boot/e2e stages, which cannot run
      # on a stock ubuntu-latest runner.
      - name: Typecheck
        working-directory: apps/swarmagents
        run: npm run typecheck

      - name: Unit tests
        working-directory: apps/swarmagents
        run: npm run test:unit

      - name: Lint
        working-directory: apps/swarmagents
        run: npm run lint

      - name: Build
        working-directory: apps/swarmagents
        run: npm run build
