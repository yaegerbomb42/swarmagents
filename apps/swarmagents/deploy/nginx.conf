# Preview WebSocket upgrades go to the in-process proxy (3778), everything
# else under /preview/ to Next.js (3777). Next.js route handlers cannot
# receive upgrades, so a Vite HMR socket under /preview/<port>/... would
# otherwise never connect; the proxy (lib/desktop-proxy) owns the upgrade
# and resolves the target through the same choke point as the HTTP routes
# (see "Desktop stream proxy" / "Preview WebSocket upgrades" in DEPLOY.md).
map $http_upgrade $preview_backend {
    default      127.0.0.1:3777;
    ~*websocket 127.0.0.1:3778;
}

server {
    listen 80;
    server_name swarmagents.codes;

    # TLS is NOT enabled by this file as shipped: there are no certificates
    # in the repo (see the commented 443 block below and the "TLS / HTTPS"
    # section of DEPLOY.md). Until TLS is enabled, this block serves the app
    # directly over plain HTTP. Once certificates exist, add the redirect
    # below and let the 443 block take over instead of serving the app here.
    #   return 301 https://$host$request_uri;

    location / {
        proxy_pass http://127.0.0.1:3777;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Strip any client-supplied identity headers and set from the immediate peer.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location /desktop/ {
        proxy_pass http://127.0.0.1:3778;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /preview/ {
        proxy_pass http://$preview_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

