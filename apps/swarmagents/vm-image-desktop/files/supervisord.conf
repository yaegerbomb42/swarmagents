; supervisord config for the swarm-vm:desktop VM.
; Runs TigerVNC's Xvnc (the X server for display :1), the XFCE session, and
; websockify, which wraps the VNC port into a browser-viewable noVNC web
; client on port 6080 (plain HTTP + WebSocket). All programs run as the
; unprivileged node user; init.sh wrote the VNC password into
; /home/node/.vnc/passwd before we start.

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisord.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:xvnc]
; The X server and the VNC server are the same process (TigerVNC's Xvnc).
; -localhost: only websockify (same container) may connect; the web client is
; never exposed directly on the network.
; -rfbauth: the password file init.sh generated from the driver's password.
command=/usr/bin/Xvnc :1 -geometry 1600x900 -depth 24 -rfbport 5901 -localhost -rfbauth /home/node/.vnc/passwd -ac -nolisten tcp
user=node
autostart=true
autorestart=true
startsecs=2
environment=HOME="/home/node"
stdout_logfile=/dev/null
stderr_logfile=/dev/null

[program:xfce4]
command=/usr/bin/dbus-launch --exit-with-session /usr/bin/xfce4-session
user=node
autostart=true
autorestart=true
startsecs=2
environment=DISPLAY=":1",HOME="/home/node"
stdout_logfile=/dev/null
stderr_logfile=/dev/null

[program:webclient]
; noVNC over WebSocket. --web serves the client at http://<container>:6080/;
; the VNC backend is the loopback-only Xvnc above.
command=/usr/bin/websockify --web /usr/share/novnc --heartbeat=30 6080 localhost:5901
user=node
autostart=true
autorestart=true
startsecs=2
environment=HOME="/home/node"
stdout_logfile=/dev/null
stderr_logfile=/dev/null
