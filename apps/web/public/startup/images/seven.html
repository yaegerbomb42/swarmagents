<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Genesis Protocol</title>
<style>
  :root {
    --space-black: #050508;
    --starlight: #F0F8FF;
    --nebula-core: #00BFFF;
    --nebula-edge: #8A2BE2;
  }

  body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background-color: var(--space-black);
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    perspective: 1000px;
  }

  .cosmos-container {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* The Singularity Point */
  .singularity {
    position: absolute;
    width: 0;
    height: 0;
    border-radius: 50%;
    background: radial-gradient(circle, var(--starlight) 10%, var(--nebula-core) 40%, var(--nebula-edge) 100%);
    box-shadow: 0 0 0px var(--nebula-core);
    opacity: 0;
    animation: bigBang 2.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  /* The Shockwave Effect */
  .shockwave {
    position: absolute;
    width: 0;
    height: 0;
    border: 2px solid var(--nebula-core);
    border-radius: 50%;
    opacity: 0;
    animation: expandWave 2s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.2s forwards;
  }

  /* The Text Construct */
  .genesis-text {
    position: relative;
    font-size: clamp(3rem, 8vw, 8rem);
    font-weight: 800;
    color: transparent;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    background: linear-gradient(90deg, var(--starlight), var(--nebula-core), var(--starlight));
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    opacity: 0;
    transform: scale(0.8) translateZ(-100px);
    filter: blur(20px);
    animation: materializeText 1.8s cubic-bezier(0.34, 1.56, 0.64, 1) 0.8s forwards,
               textBreathe 8s ease-in-out 2.6s infinite;
  }

  /* The Subtle Energy Field around the text */
  .genesis-text::after {
    content: attr(data-text);
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    background: inherit;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: blur(15px);
    opacity: 0.5;
  }

  /* Animation Keyframes */
  @keyframes bigBang {
    0% {
      width: 0;
      height: 0;
      opacity: 1;
      box-shadow: 0 0 50px var(--starlight);
    }
    40% {
      width: 20px;
      height: 20px;
      opacity: 1;
      box-shadow: 0 0 150px var(--nebula-core), 0 0 300px var(--nebula-edge);
    }
    100% {
      width: 200vmax;
      height: 200vmax;
      opacity: 0;
      box-shadow: 0 0 0px transparent;
    }
  }

  @keyframes expandWave {
    0% {
      width: 0;
      height: 0;
      opacity: 0.8;
      border-width: 10px;
    }
    100% {
      width: 150vmax;
      height: 150vmax;
      opacity: 0;
      border-width: 1px;
    }
  }

  @keyframes materializeText {
    0% {
      opacity: 0;
      transform: scale(0.5) translateZ(-500px);
      filter: blur(50px);
      letter-spacing: 1em;
    }
    100% {
      opacity: 1;
      transform: scale(1) translateZ(0);
      filter: blur(0px);
      letter-spacing: 0.2em;
    }
  }

  @keyframes textBreathe {
    0%, 100% {
      background-position: 0% center;
      transform: scale(1);
      filter: brightness(1);
    }
    50% {
      background-position: 200% center;
      transform: scale(1.02);
      filter: brightness(1.2);
    }
  }
</style>
</head>
<body>

<div class="cosmos-container">
  <div class="singularity"></div>
  <div class="shockwave"></div>
  <div class="genesis-text" data-text="HELLO WORLD">
    HELLO WORLD
  </div>
</div>

<script>
  // The architecture is primarily CSS-driven for performance.
  // JS is reserved for reactive physics states if extended in the future.
  // Currently, no JS initialization is required as the CSS animations
  // trigger immediately upon DOM injection, fulfilling the "no setup" constraint.
</script>

</body>
</html>
